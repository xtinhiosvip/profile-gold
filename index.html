<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gold XT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    color:#fff;
    background:
      radial-gradient(circle at 20% 10%,#6b4b00 0,transparent 30%),
      radial-gradient(circle at 90% 80%,#8a6200 0,transparent 28%),
      #080604;
}
.header{
    padding:22px 18px;
    text-align:center;
    border-bottom:1px solid rgba(255,215,80,.25);
    background:rgba(10,8,4,.75);
    backdrop-filter:blur(15px);
}
.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
    background:linear-gradient(90deg,#fff2a0,#ffd21c,#fff5ad);
    -webkit-background-clip:text;
    color:transparent;
}
.sub{color:#bda966;font-size:12px;margin-top:5px}

.container{
    width:min(440px,92%);
    margin:45px auto;
}
.card{
    padding:25px;
    border-radius:24px;
    border:1px solid rgba(255,215,70,.35);
    background:linear-gradient(145deg,rgba(38,27,7,.94),rgba(14,11,6,.96));
    box-shadow:0 0 45px rgba(255,190,0,.12);
}
h1{
    text-align:center;
    font-size:25px;
    margin-bottom:8px;
}
.desc{
    text-align:center;
    color:#bfb59c;
    font-size:14px;
    margin-bottom:25px;
}
label{
    display:block;
    color:#e6ca62;
    font-size:13px;
    margin-bottom:8px;
}
input{
    width:100%;
    padding:15px;
    border-radius:13px;
    border:1px solid #80651d;
    outline:none;
    background:#100d07;
    color:#fff;
    font-size:15px;
}
input:focus{border-color:#ffd21c}
button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:13px;
    cursor:pointer;
    color:#171000;
    font-weight:900;
    font-size:15px;
    background:linear-gradient(90deg,#ffe27a,#ffc400,#fff0a3);
    box-shadow:0 0 20px rgba(255,196,0,.22);
}
button:active{transform:scale(.98)}

#profile{
    display:none;
    text-align:center;
}
.avatar{
    width:105px;
    height:105px;
    margin:0 auto 15px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    background:linear-gradient(145deg,#fff0a0,#e4a900,#fff1a8);
    color:#211600;
    border:4px solid #ffdc45;
    box-shadow:0 0 35px rgba(255,205,40,.4);
}
.gold{
    color:#ffd83d;
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
}
.profileName{
    font-size:27px;
    font-weight:900;
    margin:8px 0;
}
.id{
    color:#bdb29a;
    font-size:13px;
}
.badge{
    display:inline-block;
    margin-top:13px;
    padding:7px 13px;
    border-radius:30px;
    color:#251900;
    background:#ffd52f;
    font-size:12px;
    font-weight:bold;
}
.info{
    margin-top:22px;
    padding:15px;
    border-radius:15px;
    background:rgba(255,211,55,.06);
    border:1px solid rgba(255,211,55,.18);
}
.info span{
    display:block;
    color:#a99e85;
    font-size:11px;
    margin-bottom:6px;
}
.linkbox{
    margin-top:15px;
    display:flex;
    gap:8px;
}
.linkbox input{
    min-width:0;
    font-size:12px;
}
.copy{
    width:90px;
    margin:0;
    padding:10px;
    font-size:12px;
}
.back{
    margin-top:10px;
    background:#19140b;
    color:#ffd83d;
    border:1px solid #5c4815;
}
.success{
    display:none;
    text-align:center;
    margin-top:14px;
    color:#ffe36a;
    font-size:13px;
}
.footer{
    text-align:center;
    color:#70674f;
    font-size:11px;
    margin-top:25px;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">✦ GOLD XT</div>
    <div class="sub">PREMIUM LOCKET PROFILE</div>
</div>

<div class="container">

    <!-- FORM -->
    <div class="card" id="formCard">
        <h1>Tạo Profile Gold XT</h1>
        <p class="desc">
            Nhập ID Locket để tạo trang profile Gold XT của bạn.
        </p>

        <label>ID Locket</label>
        <input id="locketId" placeholder="Ví dụ: xtinhios">

        <button onclick="createProfile()">✦ XÁC NHẬN</button>

        <div class="footer">
            Gold XT • Premium Profile Generator
        </div>
    </div>

    <!-- PROFILE -->
    <div class="card" id="profile">

        <div class="avatar" id="avatar">G</div>

        <div class="gold">✦ GOLD XT VERIFIED ✦</div>

        <div class="profileName" id="profileName">
            Locket User
        </div>

        <div class="id" id="profileId"></div>

        <div class="badge">GOLD PROFILE</div>

        <div class="info">
            <span>PROFILE LINK</span>
            <b id="profileLinkText"></b>
        </div>

        <div class="linkbox">
            <input id="profileLink" readonly>
            <button class="copy" onclick="copyLink()">SAO CHÉP</button>
        </div>

        <button onclick="openProfile()">↗ MỞ PROFILE</button>
        <button class="back" onclick="backHome()">← TẠO PROFILE KHÁC</button>

        <div class="success" id="success">
            ✓ Đã sao chép link profile!
        </div>
    </div>

</div>

<script>
function createProfile(){

    const id = document.getElementById("locketId").value.trim();

    if(!id){
        alert("Vui lòng nhập ID Locket!");
        return;
    }

    // Làm sạch ID
    const cleanId = id.replace(/[^a-zA-Z0-9_.-]/g,"");

    if(!cleanId){
        alert("ID không hợp lệ!");
        return;
    }

    const name =
        cleanId.charAt(0).toUpperCase() +
        cleanId.slice(1);

    document.getElementById("profileName").textContent = name;
    document.getElementById("profileId").textContent =
        "ID Locket: @" + cleanId;

    document.getElementById("avatar").textContent =
        cleanId.charAt(0).toUpperCase();

    /*
      Tạo link profile bằng URL hiện tại +
      #profile=ID.
      Khi đưa file này lên GitHub Pages,
      link sẽ có dạng:
      https://tenban.github.io/goldxt/#profile=xtinhios
    */
    const base =
        window.location.href.split("#")[0];

    const link =
        base + "#profile=" +
        encodeURIComponent(cleanId);

    document.getElementById("profileLink").value = link;
    document.getElementById("profileLinkText").textContent = link;

    document.getElementById("formCard").style.display="none";
    document.getElementById("profile").style.display="block";

    // Lưu profile
    localStorage.setItem("goldxt_id", cleanId);

    // Đổi URL thành link profile
    history.replaceState(
        null,
        "",
        "#profile=" + encodeURIComponent(cleanId)
    );
}

function copyLink(){

    const input =
        document.getElementById("profileLink");

    navigator.clipboard.writeText(input.value);

    const msg =
        document.getElementById("success");

    msg.style.display="block";

    setTimeout(()=>{
        msg.style.display="none";
    },2000);
}

function openProfile(){
    const link =
        document.getElementById("profileLink").value;

    window.open(link,"_blank");
}

function backHome(){

    history.replaceState(null,"",
        window.location.href.split("#")[0]
    );

    document.getElementById("profile").style.display="none";
    document.getElementById("formCard").style.display="block";
    document.getElementById("locketId").value="";
}

/*
  Nếu mở trực tiếp link:
  #profile=xtinhios
  thì tự động hiển thị profile.
*/
window.addEventListener("load",()=>{

    const hash = location.hash;

    if(hash.startsWith("#profile=")){

        const id =
            decodeURIComponent(
                hash.replace("#profile=","")
            );

        document.getElementById("locketId").value=id;

        createProfile();
    }
});
</script>

</body>
</html>
